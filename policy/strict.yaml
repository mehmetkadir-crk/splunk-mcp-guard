# strict: for analysts. Discovery and documentation tools pass, searches are
# inspected, writes and unknown tools are denied. Map people to roles under
# `principals`. Tool names are those of deslicer/mcp-for-splunk.

version: 1
profile: strict

defaults:
  role: analyst
  unknown_tool: deny          # anything not listed for the role

identity:
  source: env                 # env | header | none
  env_var: GUARD_PRINCIPAL
  header: X-Guard-Principal
  default_principal: anonymous

preflight:
  enabled: true
  refuse_if_backend_has: [can_delete, delete_by_keyword, admin_all_objects, edit_user, edit_roles, edit_roles_grantable, change_authentication]
  override_env: GUARD_ALLOW_OVERPRIVILEGED

spl:
  use_splunk_parser: true
  require_parser: true        # reject searches when the parser cannot be reached
  max_events: 1000
  earliest_floor: "-30d"
  forbid_wildcard_index: true
  require_index: true
  # commands not listed here are rejected; an empty list means denylist only
  allowed_commands:
    - search
    - tstats
    - stats
    - eventstats
    - streamstats
    - chart
    - timechart
    - top
    - rare
    - table
    - fields
    - rename
    - eval
    - where
    - head
    - tail
    - sort
    - dedup
    - rex
    - regex
    - spath
    - lookup
    - inputlookup
    - transaction
    - bin
    - bucket
    - fillnull
    - makemv
    - mvexpand
    - nomv
    - convert
    - append
    - appendcols
    - join
    - union
    - fieldsummary
    - addtotals
    - metadata
    - metasearch
    - datamodel
    - from
    - pivot
    - iplocation
    - makeresults
    - format
    - return
    - foreach
    - xyseries
    - untable
    - transpose
    - reverse
    - uniq
    - strcat
    - replace
    - multikv
    - kv
    - extract
    - inputcsv
  # in addition to the built-in list (delete, collect, outputlookup, sendemail, ...)
  denied_commands:
    - rest
    - savedsearch
    - erex
    - runshellscript

roles:
  analyst:
    # searches must start with one of these indexes
    indexes: [main, wineventlog, dns, network, os, web]
    tools:
      allow:
        - me
        - user_agent_info
        - list_indexes
        - list_sources
        - list_sourcetypes
        - get_metadata
        - list_saved_searches
        - get_saved_search_details
        - get_search_job_info
        - get_search_job_results
        - list_alert_actions
        - list_triggered_alerts
        - list_dashboards
        - get_dashboard_definition
        - list_lookup_files
        - list_lookup_definitions
        - list_kvstore_collections
        - get_kvstore_data
        - list_apps
        - get_configurations
        - list_config_files
        - get_config_spec
        - discover_splunk_docs
        - get_splunk_documentation
        - get_spl_reference
        - list_spl_commands
        - get_splunk_cheat_sheet
        - get_cim_reference
        - list_cim_data_models
        - get_admin_guide
        - list_admin_topics
        - get_troubleshooting_guide
        - list_troubleshooting_topics
        - list_available_topics
        - get_studio_topic
        - list_dashboard_studio_topics
        - list_workflows
        - workflow_requirements
        - get_executed_workflows
      inspect:
        - run_splunk_search
        - run_oneshot_search
      approve: []
      deny:
        - create_saved_search
        - update_saved_search
        - delete_saved_search
        - execute_saved_search       # saved SPL is opaque to the inspector
        - create_alert
        - update_alert
        - delete_alert
        - create_dashboard
        - create_kvstore_collection
        - create_config
        - manage_apps
        - workflow_builder
        - enhance_tool_description
        - list_users
        - get_splunk_health          # accepts credentials/host as arguments
        - sentry_test
    spl_args:
      run_splunk_search: [query]
      run_oneshot_search: [query]

  engineer:
    indexes: ["*"]
    tools:
      allow:
        - me
        - user_agent_info
        - list_indexes
        - list_sources
        - list_sourcetypes
        - get_metadata
        - list_saved_searches
        - get_saved_search_details
        - get_search_job_info
        - get_search_job_results
        - list_alert_actions
        - list_triggered_alerts
        - list_dashboards
        - get_dashboard_definition
        - list_lookup_files
        - list_lookup_definitions
        - list_kvstore_collections
        - get_kvstore_data
        - list_apps
        - list_users
        - get_configurations
        - list_config_files
        - get_config_spec
        - get_splunk_health
        - discover_splunk_docs
        - get_splunk_documentation
        - get_spl_reference
        - list_spl_commands
        - get_splunk_cheat_sheet
        - get_cim_reference
        - list_cim_data_models
        - get_admin_guide
        - list_admin_topics
        - get_troubleshooting_guide
        - list_troubleshooting_topics
        - list_available_topics
        - get_studio_topic
        - list_dashboard_studio_topics
        - list_workflows
        - workflow_requirements
        - get_executed_workflows
      inspect:
        - run_splunk_search
        - run_oneshot_search
      approve:
        - create_saved_search
        - update_saved_search
        - execute_saved_search
        - create_alert
        - update_alert
        - create_dashboard
        - create_kvstore_collection
        - workflow_builder
      deny:
        - delete_saved_search
        - delete_alert
        - create_config              # .conf writes can silently break parsing
        - manage_apps
        - enhance_tool_description
        - sentry_test
    spl_args:
      run_splunk_search: [query]
      run_oneshot_search: [query]

principals:
  # ahmet: analyst
  # bob: engineer

audit:
  path: ./guard-audit.jsonl
  alert_on_denied: true
  denied_threshold: 3
  window_seconds: 300
  hec_url: null               # e.g. https://splunk.example:8088, token in GUARD_HEC_TOKEN
  hec_verify_tls: true
  hec_ca_bundle: null
  hec_index: null
  redact_arg_keys: [password, token, secret, authorization, splunk_password]

approval:
  # auto: ask through the client, fall back to the approval directory.
  # Whoever can write to the directory can approve; keep it away from the
  # assistant's own tools. GUARD_APPROVAL_DIR overrides dir.
  mode: auto
  dir: ./guard-approvals
  timeout_seconds: 120

# MCP resources and prompts from the backend are not covered by the tool rules.
extras:
  resources: deny
  prompts: deny

output:
  tag_untrusted: true
  detect_injection: true
  redact_secrets: true
