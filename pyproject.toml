[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "splunk-mcp-guard"
version = "0.1.0"
description = "Policy-enforcing proxy that sits in front of any Splunk MCP server: per-principal tool policy, Splunk-parser-backed SPL inspection, human approval for writes, audit log, untrusted-output tagging."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Mehmet Kadir Cirik" }]
keywords = ["splunk", "mcp", "model-context-protocol", "security", "siem", "guardrails", "blue-team"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = [
  "fastmcp>=4.0.3",
  "pyyaml>=6.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
splunk-mcp-guard = "splunk_mcp_guard.main:main"

[project.urls]
Homepage = "https://github.com/mehmetkadir-crk/splunk-mcp-guard"
Issues = "https://github.com/mehmetkadir-crk/splunk-mcp-guard/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/splunk_mcp_guard"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
